<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7b2ff7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f107a3;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <radialGradient id="pulse1">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0" />
    </radialGradient>
    
    <radialGradient id="pulse2">
      <stop offset="0%" style="stop-color:#f107a3;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#f107a3;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)"/>
  
  <!-- Animated Grid -->
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="url(#accentGradient)" stroke-width="0.5" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" fill="url(#grid)"/>
  
  <!-- Pulsing Orbs -->
  <circle cx="200" cy="100" r="80" fill="url(#pulse1)">
    <animate attributeName="r" values="80;100;80" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="1000" cy="300" r="70" fill="url(#pulse2)">
    <animate attributeName="r" values="70;90;70" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Floating Code Symbols -->
  <text x="100" y="180" font-family="'Courier New', monospace" font-size="60" fill="#00d4ff" opacity="0.3" filter="url(#glow)">
    &lt;/&gt;
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="4s" repeatCount="indefinite"/>
  </text>
  
  <text x="1050" y="150" font-family="'Courier New', monospace" font-size="50" fill="#f107a3" opacity="0.3" filter="url(#glow)">
    { }
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,10; 0,0" dur="3s" repeatCount="indefinite"/>
  </text>
  
  <!-- Main Title -->
  <text x="600" y="110" font-family="'Arial Black', sans-serif" font-size="58" font-weight="bold" fill="url(#accentGradient)" text-anchor="middle" filter="url(#glow)">
    TAFSIR CHOWDHURY
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="160" font-family="Arial, sans-serif" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="bold">
    🚀 MERN Stack Web Developer | Building Amazing Experiences
  </text>
  
  <!-- Animated Underline -->
  <line x1="300" y1="175" x2="900" y2="175" stroke="url(#accentGradient)" stroke-width="3" opacity="0.6">
    <animate attributeName="x2" values="300;900;300" dur="2s" repeatCount="indefinite"/>
  </line>
  
  <!-- Tech Stack Cards -->
  <g transform="translate(220, 220)">
    <!-- MongoDB -->
    <rect x="0" y="0" width="160" height="100" rx="15" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="3"/>
    <rect x="5" y="5" width="150" height="90" rx="12" fill="none" stroke="#10b981" stroke-width="1" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="80" y="50" font-family="'Arial Black', sans-serif" font-size="48" fill="#10b981" text-anchor="middle" font-weight="bold" filter="url(#glow)">M</text>
    <text x="80" y="80" font-family="Arial, sans-serif" font-size="16" fill="#10b981" text-anchor="middle" font-weight="bold">MongoDB</text>
    
    <!-- Express -->
    <rect x="185" y="0" width="160" height="100" rx="15" fill="rgba(255, 255, 255, 0.15)" stroke="#ffffff" stroke-width="3"/>
    <rect x="190" y="5" width="150" height="90" rx="12" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.3s" repeatCount="indefinite"/>
    </rect>
    <text x="265" y="50" font-family="'Arial Black', sans-serif" font-size="48" fill="#ffffff" text-anchor="middle" font-weight="bold" filter="url(#glow)">E</text>
    <text x="265" y="80" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Express.js</text>
    
    <!-- React -->
    <rect x="370" y="0" width="160" height="100" rx="15" fill="rgba(97, 218, 251, 0.15)" stroke="#61dafb" stroke-width="3"/>
    <rect x="375" y="5" width="150" height="90" rx="12" fill="none" stroke="#61dafb" stroke-width="1" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <text x="450" y="50" font-family="'Arial Black', sans-serif" font-size="48" fill="#61dafb" text-anchor="middle" font-weight="bold" filter="url(#glow)">R</text>
    <text x="450" y="80" font-family="Arial, sans-serif" font-size="16" fill="#61dafb" text-anchor="middle" font-weight="bold">React</text>
    
    <!-- Node.js -->
    <rect x="555" y="0" width="160" height="100" rx="15" fill="rgba(104, 160, 99, 0.15)" stroke="#68a063" stroke-width="3"/>
    <rect x="560" y="5" width="150" height="90" rx="12" fill="none" stroke="#68a063" stroke-width="1" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.9s" repeatCount="indefinite"/>
    </rect>
    <text x="635" y="50" font-family="'Arial Black', sans-serif" font-size="48" fill="#68a063" text-anchor="middle" font-weight="bold" filter="url(#glow)">N</text>
    <text x="635" y="80" font-family="Arial, sans-serif" font-size="16" fill="#68a063" text-anchor="middle" font-weight="bold">Node.js</text>
  </g>
  
  <!-- Floating Particles -->
  <circle cx="400" cy="190" r="3" fill="#00d4ff" opacity="0.8">
    <animate attributeName="cy" values="190;170;190" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="800" cy="195" r="3" fill="#f107a3" opacity="0.8">
    <animate attributeName="cy" values="195;175;195" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="950" cy="240" r="2" fill="#7b2ff7" opacity="0.6">
    <animate attributeName="cx" values="950;970;950" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="250" cy="350" r="2" fill="#00d4ff" opacity="0.6">
    <animate attributeName="cx" values="250;230;250" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Status Text -->
  <text x="600" y="365" font-family="'Courier New', monospace" font-size="16" fill="#00d4ff" text-anchor="middle" font-weight="bold" opacity="0.9">
    🌱 Currently Learning: Next.js | 💬 Ask me about: Web Development | ⚡ I Love Code
  </text>
  
  <!-- Bottom Animated Wave -->
  <path d="M 0 390 Q 300 380 600 390 T 1200 390 L 1200 400 L 0 400 Z" fill="url(#accentGradient)" opacity="0.4">
    <animate attributeName="d" 
             values="M 0 390 Q 300 380 600 390 T 1200 390 L 1200 400 L 0 400 Z;
                     M 0 390 Q 300 400 600 390 T 1200 390 L 1200 400 L 0 400 Z;
                     M 0 390 Q 300 380 600 390 T 1200 390 L 1200 400 L 0 400 Z" 
             dur="4s" 
             repeatCount="indefinite"/>
  </path>
</svg>
