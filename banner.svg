<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)"/>
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.3"/>
  </pattern>
  <rect width="1200" height="400" fill="url(#grid)"/>
  
  <!-- Decorative Circles -->
  <circle cx="100" cy="100" r="150" fill="#1e40af" opacity="0.1"/>
  <circle cx="1100" cy="300" r="120" fill="#7c3aed" opacity="0.1"/>
  
  <!-- Code Brackets -->
  <text x="80" y="120" font-family="'Courier New', monospace" font-size="120" fill="#334155" opacity="0.3">&lt;</text>
  <text x="1080" y="320" font-family="'Courier New', monospace" font-size="120" fill="#334155" opacity="0.3">/&gt;</text>
  
  <!-- Main Title -->
  <text x="600" y="140" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Web Developer
  </text>
  
  <!-- Subtitle with gradient -->
  <text x="600" y="190" font-family="Arial, sans-serif" font-size="24" fill="url(#accentGradient)" text-anchor="middle">
    Building MERN Stack Web Applications
  </text>
  
  <!-- Tech Stack Icons Labels -->
  <g transform="translate(300, 250)">
    <!-- MongoDB -->
    <rect x="0" y="0" width="120" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="60" y="30" font-family="Arial, sans-serif" font-size="32" fill="#10b981" text-anchor="middle" font-weight="bold">M</text>
    <text x="60" y="55" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">MongoDB</text>
    
    <!-- Express -->
    <rect x="140" y="0" width="120" height="80" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <text x="200" y="30" font-family="Arial, sans-serif" font-size="32" fill="#64748b" text-anchor="middle" font-weight="bold">E</text>
    <text x="200" y="55" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Express</text>
    
    <!-- React -->
    <rect x="280" y="0" width="120" height="80" rx="8" fill="#1e293b" stroke="#61dafb" stroke-width="2"/>
    <text x="340" y="30" font-family="Arial, sans-serif" font-size="32" fill="#61dafb" text-anchor="middle" font-weight="bold">R</text>
    <text x="340" y="55" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">React</text>
    
    <!-- Node.js -->
    <rect x="420" y="0" width="120" height="80" rx="8" fill="#1e293b" stroke="#68a063" stroke-width="2"/>
    <text x="480" y="30" font-family="Arial, sans-serif" font-size="32" fill="#68a063" text-anchor="middle" font-weight="bold">N</text>
    <text x="480" y="55" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Node.js</text>
  </g>
  
  <!-- Bottom accent line -->
  <rect x="0" y="395" width="1200" height="5" fill="url(#accentGradient)"/>
</svg>

